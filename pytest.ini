[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    # A limiter or replay check that is called without await is a coroutine, which is always
    # true: the check silently stops checking. Fail the test instead.
    error:coroutine .* was never awaited:RuntimeWarning
    error::pytest.PytestUnraisableExceptionWarning
