name: Test

on:
  push:
    branches:
      - main
  pull_request:
  # deploy-cloud-run.yml runs this same job before it deploys.
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from that release's checksums.txt.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so gitleaks scans every commit and not only the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -sSfL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" dir . --config .gitleaks.toml --no-banner --redact
          "${RUNNER_TEMP}/gitleaks" git . --config .gitleaks.toml --no-banner --redact

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests alembic/env.py

      # The production lock only: a known vulnerability in what ships fails the build.
      # --disable-pip reads the hashed lock as written instead of resolving it again.
      - name: Audit production dependencies
        run: pip-audit --requirement requirements.txt --require-hashes --disable-pip

      - name: Pytest
        run: pytest

  # Builds the production image and pushes nothing. The tests above install into the runner's
  # Python, so a change that only breaks the image (a new base image, a dependency with no
  # wheel for it) used to pass here and fail at the deploy.
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --pull --tag saturn-api:ci .

      - name: Installed packages agree with each other
        run: docker run --rm --entrypoint python saturn-api:ci -m pip check

      # Imports every router and model with the production dependencies only. Nothing connects:
      # the engine is created lazily and the bootstrap is skipped.
      - name: The application imports inside the image
        run: >-
          docker run --rm --entrypoint python
          -e SKIP_DB_BOOTSTRAP=true
          -e DATABASE_URL=postgresql+asyncpg://ci:ci@127.0.0.1:1/ci
          saturn-api:ci -c "import app.main"

  # The tests above run on SQLite. Migrations are PostgreSQL DDL and nothing else ran them
  # before a deploy did, so a bad one was first seen in production.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saturn
          POSTGRES_PASSWORD: saturn-ci
          POSTGRES_DB: saturn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saturn -d saturn"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://saturn:saturn-ci@localhost:5432/saturn
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install --require-hashes -r requirements.txt

      - name: Apply every migration
        run: alembic upgrade head

      # The newest migration must come off and go back on cleanly, and a second run must find nothing to do.
      - name: Reverse and reapply the newest migration
        run: |
          set -euo pipefail
          alembic downgrade -1
          alembic upgrade head
          alembic upgrade head
