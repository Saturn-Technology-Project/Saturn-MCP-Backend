name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time, so two releases never run migrations or
# replace revisions concurrently. A newer push waits instead of cancelling.
concurrency:
  group: deploy-cloud-run-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'saturn' }}
  CLOUD_RUN_SERVICE: ${{ vars.BACKEND_CLOUD_RUN_SERVICE || 'saturn-backend' }}
  IMAGE_NAME: saturn-backend

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Protection rules (required reviewers, deployment branch = main) are set
    # on this environment in GitHub. See infra/gcp/README.md.
    environment: production
    permissions:
      contents: read
      id-token: write

    # Optional settings. Each one left unset keeps the behaviour from before it existed.
    env:
      # Runtime identity for the services and the migration job. Unset: the
      # project's default compute service account.
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
      # all | internal | internal-and-cloud-load-balancing. Unset: the API keeps its current ingress.
      CLOUD_RUN_INGRESS: ${{ vars.CLOUD_RUN_INGRESS }}
      # 'true': run migrations once in a Cloud Run Job and start the services with RUN_MIGRATIONS=false.
      MIGRATIONS_JOB: ${{ vars.MIGRATIONS_JOB }}
      MIGRATIONS_JOB_NAME: ${{ vars.MIGRATIONS_JOB_NAME || 'saturn-migrate' }}
      MIGRATIONS_DATABASE_URL_SECRET: ${{ vars.MIGRATIONS_DATABASE_URL_SECRET || 'DATABASE_URL' }}
      MIGRATIONS_SERVICE_ACCOUNT: ${{ vars.MIGRATIONS_SERVICE_ACCOUNT || vars.RUNTIME_SERVICE_ACCOUNT }}
      # 'true': mount SEED_USER_EMAIL / SEED_USER_PASSWORD on the API so it can create the first admin.
      SEED_ON_DEPLOY: ${{ vars.SEED_ON_DEPLOY }}
      # Secret Manager secret that holds REDIS_URL (for example a rediss:// URL with AUTH).
      REDIS_URL_SECRET: ${{ vars.REDIS_URL_SECRET || 'REDIS_URL' }}
      # Secret Manager secret shared with the console (its CONSOLE_PROXY_SECRET_NAME). With it the API
      # trusts the browser address the console forwards, so per-address limits are not shared by every
      # console user. Unset: the API keys limits on the address Cloudflare reports, as before.
      CONSOLE_PROXY_SECRET_NAME: ${{ vars.CONSOLE_PROXY_SECRET_NAME }}
      # Secret Manager secrets that hold the value being rotated out. While one is set, the API
      # accepts both the new and the old value, so Cloudflare (or the console) and this service
      # can be switched one after the other with no window of 403s. Unset it again afterwards.
      ORIGIN_AUTH_SECRET_PREVIOUS_NAME: ${{ vars.ORIGIN_AUTH_SECRET_PREVIOUS_NAME }}
      CONSOLE_PROXY_SECRET_PREVIOUS_NAME: ${{ vars.CONSOLE_PROXY_SECRET_PREVIOUS_NAME }}
      # 'true': refuse to deploy while a hardening setting below is still at its legacy default.
      REQUIRE_HARDENED_DEPLOY: ${{ vars.REQUIRE_HARDENED_DEPLOY }}
      # Secret Manager secret with the Memorystore server CA (PEM), mounted at REDIS_CA_PATH.
      REDIS_CA_SECRET: ${{ vars.REDIS_CA_SECRET }}
      REDIS_CA_PATH: /etc/secrets/redis-ca/ca.pem
      CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      SERVERLESS_VPC_CONNECTOR: ${{ vars.SERVERLESS_VPC_CONNECTOR }}
      MAX_INSTANCES: ${{ vars.MAX_INSTANCES || '10' }}

    steps:
      - name: Only deploy from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production deploys run only from refs/heads/main, not ${GITHUB_REF}."
            exit 1
          fi

      # Each of these is optional so an older setup keeps deploying, but the default each one
      # falls back to is the unsafe one. Say so on every run instead of staying silent.
      - name: Check hardening settings
        run: |
          set -euo pipefail
          missing=0
          note() { echo "::warning title=Deploy hardening::$1"; missing=1; }
          if [ -z "${RUNTIME_SERVICE_ACCOUNT}" ]; then
            note "RUNTIME_SERVICE_ACCOUNT is not set: the services run as the project's default compute service account, which usually has the Editor role."
          fi
          if [ "${MIGRATIONS_JOB}" != "true" ]; then
            note "MIGRATIONS_JOB is not 'true': every container migrates on start with the application's database user."
          fi
          case "${CLOUD_RUN_INGRESS}" in
            internal | internal-and-cloud-load-balancing) ;;
            *) note "CLOUD_RUN_INGRESS is '${CLOUD_RUN_INGRESS:-unset}': the run.app address is reachable from the internet, so only the origin secret separates it from Cloudflare." ;;
          esac
          if [ "${missing}" = "1" ] && [ "${REQUIRE_HARDENED_DEPLOY}" = "true" ]; then
            echo "::error::REQUIRE_HARDENED_DEPLOY is true and a hardening setting is missing. See infra/gcp/README.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build image tag
        id: image
        run: |
          IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      # Provenance and SBOM attestations need a BuildKit container builder, and they
      # turn the pushed image into an OCI index. Opt in with IMAGE_ATTESTATIONS=true
      # after checking Cloud Run accepts that index (infra/gcp/README.md).
      - name: Set up Docker Buildx
        if: vars.IMAGE_ATTESTATIONS == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: ${{ vars.IMAGE_ATTESTATIONS == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ vars.IMAGE_ATTESTATIONS == 'true' }}
          tags: ${{ steps.image.outputs.uri }}

      - name: Render runtime env file
        env:
          DEFAULT_ORG_ID: ${{ vars.DEFAULT_ORG_ID }}
          DEFAULT_ACTOR_ID: ${{ vars.DEFAULT_ACTOR_ID }}
          SEED_USER_NAME: ${{ vars.SEED_USER_NAME }}
          SESSION_TTL_DAYS: ${{ vars.SESSION_TTL_DAYS }}
          CORS_ORIGINS: https://dashboard.saturn-core.com
          PUBLIC_WS_URL: https://api.saturn-core.com
          SATURN_KMS_KEY: ${{ vars.SATURN_KMS_KEY }}
          LEGACY_PASSWORD_UNTIL: ${{ vars.LEGACY_PASSWORD_UNTIL }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import date
          from pathlib import Path

          values = {
              "EXPOSE_API_DOCS": "false",
              "DEFAULT_ORG_ID": os.environ.get("DEFAULT_ORG_ID") or "org_saturn",
              "DEFAULT_ACTOR_ID": os.environ.get("DEFAULT_ACTOR_ID") or "user_operator",
              "SEED_USER_NAME": os.environ.get("SEED_USER_NAME") or "Admin",
              "SESSION_TTL_DAYS": os.environ.get("SESSION_TTL_DAYS") or "7",
              "CORS_ORIGINS": os.environ["CORS_ORIGINS"],
              "PUBLIC_WS_URL": os.environ["PUBLIC_WS_URL"],
              "SATURN_KMS_KEY": os.environ["SATURN_KMS_KEY"],
              "SATURN_EMBED_WORKER": "false",
          }
          legacy_until = (os.environ.get("LEGACY_PASSWORD_UNTIL") or "").strip()
          if legacy_until:
              # The app parses this on every legacy sign-in; a bad value would fail each one.
              date.fromisoformat(legacy_until)
              values["LEGACY_PASSWORD_UNTIL"] = legacy_until
          if os.environ.get("MIGRATIONS_JOB") == "true":
              # The job below has already migrated; the containers must not.
              values["RUN_MIGRATIONS"] = "false"
          Path("cloud-run.env.yaml").write_text(
              "".join(f'{key}: "{value}"\n' for key, value in values.items()),
              encoding="utf-8",
          )
          values["SATURN_EMBED_WORKER"] = "true"
          Path("cloud-run.worker.env.yaml").write_text(
              "".join(f'{key}: "{value}"\n' for key, value in values.items()),
              encoding="utf-8",
          )
          PY

      # Each service gets only the secrets it reads. --set-secrets replaces the
      # whole set, so anything left out here is unmounted on deploy.
      - name: Resolve secrets per service
        run: |
          set -euo pipefail
          common="DATABASE_URL=DATABASE_URL:latest,REDIS_URL=${REDIS_URL_SECRET}:latest"
          if [ -n "${REDIS_CA_SECRET}" ]; then
            common="${common},${REDIS_CA_PATH}=${REDIS_CA_SECRET}:latest"
          fi
          api="${common}"
          api="${api},SATURN_GITHUB_OAUTH_CLIENT_ID=SATURN_GITHUB_OAUTH_CLIENT_ID:latest"
          api="${api},SATURN_GITHUB_OAUTH_CLIENT_SECRET=SATURN_GITHUB_OAUTH_CLIENT_SECRET:latest"
          api="${api},SATURN_GOOGLE_OAUTH_CLIENT_ID=SATURN_GOOGLE_OAUTH_CLIENT_ID:latest"
          api="${api},SATURN_GOOGLE_OAUTH_CLIENT_SECRET=SATURN_GOOGLE_OAUTH_CLIENT_SECRET:latest"
          api="${api},RESEND_API_KEY=RESEND_API_KEY:latest,RESEND_FROM=RESEND_FROM:latest"
          api="${api},POLICY_LLM_BASE_URL=POLICY_LLM_BASE_URL:latest"
          api="${api},POLICY_LLM_API_KEY=POLICY_LLM_API_KEY:latest"
          api="${api},POLICY_LLM_MODEL=POLICY_LLM_MODEL:latest"
          api="${api},ORIGIN_AUTH_SECRET=ORIGIN_AUTH_SECRET:latest"
          if [ -n "${CONSOLE_PROXY_SECRET_NAME}" ]; then
            api="${api},CONSOLE_PROXY_SECRET=${CONSOLE_PROXY_SECRET_NAME}:latest"
          fi
          if [ -n "${ORIGIN_AUTH_SECRET_PREVIOUS_NAME}" ]; then
            api="${api},ORIGIN_AUTH_SECRET_PREVIOUS=${ORIGIN_AUTH_SECRET_PREVIOUS_NAME}:latest"
          fi
          if [ -n "${CONSOLE_PROXY_SECRET_PREVIOUS_NAME}" ]; then
            api="${api},CONSOLE_PROXY_SECRET_PREVIOUS=${CONSOLE_PROXY_SECRET_PREVIOUS_NAME}:latest"
          fi
          if [ "${SEED_ON_DEPLOY}" = "true" ]; then
            api="${api},SEED_USER_EMAIL=SEED_USER_EMAIL:latest,SEED_USER_PASSWORD=SEED_USER_PASSWORD:latest"
          fi
          # The worker expires approvals and delivers webhooks. Expiry sends the
          # task-outcome email, so it needs Resend; it serves no public traffic.
          worker="${common},RESEND_API_KEY=RESEND_API_KEY:latest,RESEND_FROM=RESEND_FROM:latest"
          {
            echo "API_SECRETS=${api}"
            echo "WORKER_SECRETS=${worker}"
          } >> "${GITHUB_ENV}"

      - name: Run database migrations
        if: env.MIGRATIONS_JOB == 'true'
        env:
          IMAGE_REF: ${{ steps.image.outputs.uri }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${MIGRATIONS_SERVICE_ACCOUNT}" ]; then
            extra+=(--service-account "${MIGRATIONS_SERVICE_ACCOUNT}")
          fi
          gcloud run jobs deploy "${MIGRATIONS_JOB_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE_REF}" \
            --command alembic \
            --args upgrade,head \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 900s \
            --cpu 1 \
            --memory 512Mi \
            --set-secrets "DATABASE_URL=${MIGRATIONS_DATABASE_URL_SECRET}:latest" \
            --set-cloudsql-instances "${CLOUD_SQL_INSTANCE_CONNECTION_NAME}" \
            --vpc-connector "${SERVERLESS_VPC_CONNECTOR}" \
            --vpc-egress private-ranges-only \
            "${extra[@]}" \
            --execute-now \
            --wait

      - name: Deploy to Cloud Run
        env:
          IMAGE_REF: ${{ steps.image.outputs.uri }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${RUNTIME_SERVICE_ACCOUNT}" ]; then
            extra+=(--service-account "${RUNTIME_SERVICE_ACCOUNT}")
          fi
          case "${CLOUD_RUN_INGRESS}" in
            "") ;;
            all | internal | internal-and-cloud-load-balancing)
              extra+=(--ingress "${CLOUD_RUN_INGRESS}") ;;
            *)
              echo "::error::CLOUD_RUN_INGRESS must be all, internal or internal-and-cloud-load-balancing."
              exit 1 ;;
          esac
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE_REF}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --timeout 3600 \
            --no-session-affinity \
            --cpu 1 \
            --memory 512Mi \
            --max-instances "${MAX_INSTANCES}" \
            --env-vars-file cloud-run.env.yaml \
            --set-secrets "${API_SECRETS}" \
            --add-cloudsql-instances "${CLOUD_SQL_INSTANCE_CONNECTION_NAME}" \
            --vpc-connector "${SERVERLESS_VPC_CONNECTOR}" \
            --vpc-egress private-ranges-only \
            --startup-probe=timeoutSeconds=10,periodSeconds=10,failureThreshold=36,tcpSocket.port=8000 \
            "${extra[@]}"

      - name: Deploy webhook worker
        env:
          IMAGE_REF: ${{ steps.image.outputs.uri }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${RUNTIME_SERVICE_ACCOUNT}" ]; then
            extra+=(--service-account "${RUNTIME_SERVICE_ACCOUNT}")
          fi
          gcloud run deploy saturn-worker \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE_REF}" \
            --platform managed \
            --no-allow-unauthenticated \
            --ingress internal \
            --port 8000 \
            --timeout 300 \
            --min-instances 1 \
            --max-instances 1 \
            --no-cpu-throttling \
            --cpu 1 \
            --memory 512Mi \
            --env-vars-file cloud-run.worker.env.yaml \
            --set-secrets "${WORKER_SECRETS}" \
            --add-cloudsql-instances "${CLOUD_SQL_INSTANCE_CONNECTION_NAME}" \
            --vpc-connector "${SERVERLESS_VPC_CONNECTOR}" \
            --vpc-egress private-ranges-only \
            --startup-probe=timeoutSeconds=10,periodSeconds=10,failureThreshold=36,tcpSocket.port=8000 \
            "${extra[@]}"
